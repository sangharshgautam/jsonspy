<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#082849"/>
    </linearGradient>

    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c8de9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14.4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="1080" fill="url(#bg)"/>

  <!-- Subtle Background Grid Pattern -->
  <g stroke="#1e293b" stroke-width="2" opacity="0.4">
    <line x1="0" y1="0" x2="0" y2="1080"/><line x1="36" y1="0" x2="36" y2="1080"/><line x1="72" y1="0" x2="72" y2="1080"/><line x1="108" y1="0" x2="108" y2="1080"/><line x1="144" y1="0" x2="144" y2="1080"/><line x1="180" y1="0" x2="180" y2="1080"/><line x1="216" y1="0" x2="216" y2="1080"/><line x1="252" y1="0" x2="252" y2="1080"/><line x1="288" y1="0" x2="288" y2="1080"/><line x1="324" y1="0" x2="324" y2="1080"/><line x1="360" y1="0" x2="360" y2="1080"/><line x1="396" y1="0" x2="396" y2="1080"/><line x1="432" y1="0" x2="432" y2="1080"/><line x1="468" y1="0" x2="468" y2="1080"/><line x1="504" y1="0" x2="504" y2="1080"/><line x1="540" y1="0" x2="540" y2="1080"/><line x1="576" y1="0" x2="576" y2="1080"/><line x1="612" y1="0" x2="612" y2="1080"/><line x1="648" y1="0" x2="648" y2="1080"/><line x1="684" y1="0" x2="684" y2="1080"/>
    <line x1="0" y1="0" x2="720" y2="0"/><line x1="0" y1="54" x2="720" y2="54"/><line x1="0" y1="108" x2="720" y2="108"/><line x1="0" y1="162" x2="720" y2="162"/><line x1="0" y1="216" x2="720" y2="216"/><line x1="0" y1="270" x2="720" y2="270"/><line x1="0" y1="324" x2="720" y2="324"/><line x1="0" y1="378" x2="720" y2="378"/><line x1="0" y1="432" x2="720" y2="432"/><line x1="0" y1="486" x2="720" y2="486"/><line x1="0" y1="540" x2="720" y2="540"/><line x1="0" y1="594" x2="720" y2="594"/><line x1="0" y1="648" x2="720" y2="648"/><line x1="0" y1="702" x2="720" y2="702"/><line x1="0" y1="756" x2="720" y2="756"/><line x1="0" y1="810" x2="720" y2="810"/><line x1="0" y1="864" x2="720" y2="864"/><line x1="0" y1="918" x2="720" y2="918"/><line x1="0" y1="972" x2="720" y2="972"/><line x1="0" y1="1026" x2="720" y2="1026"/>
  </g>

  <!-- Radial Glow Behind Logo -->
  <circle cx="360" cy="432" r="302.4" fill="#0c8de9" opacity="0.25" filter="url(#glow)"/>

  <!-- Logo Icon Badge -->
  <g transform="translate(234, 306)">
    <rect width="251.99999999999997" height="251.99999999999997" rx="55.43999999999999" fill="url(#brand)"/>

    <!-- Code Brackets { } -->
    <text x="125.99999999999999" y="171.35999999999999" font-family="JetBrains Mono, Arial, sans-serif" font-weight="900" font-size="131.04" fill="#ffffff" text-anchor="middle">{ }</text>
  </g>

  <!-- Main Title -->
  <text x="360" y="734.4000000000001" font-family="Inter, system-ui, Arial, sans-serif" font-weight="900" font-size="57.6" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    JSON<tspan fill="#36a9f8">Spy</tspan>
  </text>

  <!-- Subtitle -->
  <text x="360" y="810" font-family="Inter, system-ui, Arial, sans-serif" font-weight="600" font-size="25.200000000000003" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    ENTERPRISE WORKBENCH
  </text>
</svg>