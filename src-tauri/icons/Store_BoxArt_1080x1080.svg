<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#082849"/>
    </linearGradient>

    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c8de9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="21.6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Subtle Background Grid Pattern -->
  <g stroke="#1e293b" stroke-width="2" opacity="0.4">
    <line x1="0" y1="0" x2="0" y2="1080"/><line x1="54" y1="0" x2="54" y2="1080"/><line x1="108" y1="0" x2="108" y2="1080"/><line x1="162" y1="0" x2="162" y2="1080"/><line x1="216" y1="0" x2="216" y2="1080"/><line x1="270" y1="0" x2="270" y2="1080"/><line x1="324" y1="0" x2="324" y2="1080"/><line x1="378" y1="0" x2="378" y2="1080"/><line x1="432" y1="0" x2="432" y2="1080"/><line x1="486" y1="0" x2="486" y2="1080"/><line x1="540" y1="0" x2="540" y2="1080"/><line x1="594" y1="0" x2="594" y2="1080"/><line x1="648" y1="0" x2="648" y2="1080"/><line x1="702" y1="0" x2="702" y2="1080"/><line x1="756" y1="0" x2="756" y2="1080"/><line x1="810" y1="0" x2="810" y2="1080"/><line x1="864" y1="0" x2="864" y2="1080"/><line x1="918" y1="0" x2="918" y2="1080"/><line x1="972" y1="0" x2="972" y2="1080"/><line x1="1026" y1="0" x2="1026" y2="1080"/>
    <line x1="0" y1="0" x2="1080" y2="0"/><line x1="0" y1="54" x2="1080" y2="54"/><line x1="0" y1="108" x2="1080" y2="108"/><line x1="0" y1="162" x2="1080" y2="162"/><line x1="0" y1="216" x2="1080" y2="216"/><line x1="0" y1="270" x2="1080" y2="270"/><line x1="0" y1="324" x2="1080" y2="324"/><line x1="0" y1="378" x2="1080" y2="378"/><line x1="0" y1="432" x2="1080" y2="432"/><line x1="0" y1="486" x2="1080" y2="486"/><line x1="0" y1="540" x2="1080" y2="540"/><line x1="0" y1="594" x2="1080" y2="594"/><line x1="0" y1="648" x2="1080" y2="648"/><line x1="0" y1="702" x2="1080" y2="702"/><line x1="0" y1="756" x2="1080" y2="756"/><line x1="0" y1="810" x2="1080" y2="810"/><line x1="0" y1="864" x2="1080" y2="864"/><line x1="0" y1="918" x2="1080" y2="918"/><line x1="0" y1="972" x2="1080" y2="972"/><line x1="0" y1="1026" x2="1080" y2="1026"/>
  </g>

  <!-- Radial Glow Behind Logo -->
  <circle cx="540" cy="453.59999999999997" r="453.59999999999997" fill="#0c8de9" opacity="0.25" filter="url(#glow)"/>

  <!-- Logo Icon Badge -->
  <g transform="translate(351, 264.59999999999997)">
    <rect width="378" height="378" rx="83.16" fill="url(#brand)"/>

    <!-- Code Brackets { } -->
    <text x="189" y="257.04" font-family="JetBrains Mono, Arial, sans-serif" font-weight="900" font-size="196.56" fill="#ffffff" text-anchor="middle">{ }</text>
  </g>

  <!-- Main Title -->
  <text x="540" y="777.6" font-family="Inter, system-ui, Arial, sans-serif" font-weight="900" font-size="86.4" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    JSON<tspan fill="#36a9f8">Spy</tspan>
  </text>

  <!-- Subtitle -->
  <text x="540" y="853.2" font-family="Inter, system-ui, Arial, sans-serif" font-weight="600" font-size="37.800000000000004" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    ENTERPRISE WORKBENCH
  </text>
</svg>