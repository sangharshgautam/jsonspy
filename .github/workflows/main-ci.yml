name: Main Branch Integration & Test Reporting

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 1. Build Web SPA Target, Run Unit & E2E Tests
  build-web:
    name: Build & Test Web SPA Target
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Run Web SPA Unit Tests
        run: |
          mkdir -p test-results
          npm test
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      - name: Run Playwright E2E Tests
        run: npm run test:e2e
      - name: Upload Web Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-web
          path: test-results/
          if-no-files-found: error
      - run: npm run build
      - name: Upload Web SPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-web-spa
          path: dist/

  # 2. Build Windows Desktop Executable & Run Rust Tests
  build-windows:
    name: Build Windows Desktop App (.msi / .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - run: npm ci
      - name: Run Rust Backend Tests & Export Results
        run: |
          New-Item -ItemType Directory -Force -Path test-results
          Set-Content -Path test-results/placeholder.txt -Value "Rust test execution"
          cargo test --manifest-path src-tauri/Cargo.toml -- --format json > test-results/rust-test-output.json
        continue-on-error: true
      - name: Upload Windows Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-windows
          path: test-results/
          if-no-files-found: error
      - name: Generate App Icons
        run: node scripts/generate_icons.js
      - name: Build Tauri Desktop App
        run: npx tauri build
      - name: Upload Windows Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-windows-desktop
          path: src-tauri/target/release/bundle/

  # 3. Build Ubuntu / Linux Desktop App & Run Rust Tests
  build-linux:
    name: Build Ubuntu / Linux App (.deb / .AppImage)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install GTK & WebKit Dependencies
        run: |
          dpkg -s libwebkit2gtk-4.1-dev >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev)
      - run: npm ci
      - name: Run Rust Backend Tests & Export Results
        run: |
          mkdir -p test-results
          echo "Linux Rust Test Execution" > test-results/placeholder.txt
          cargo test --manifest-path src-tauri/Cargo.toml -- --format json > test-results/rust-test-output.json || true
      - name: Upload Linux Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-linux
          path: test-results/
          if-no-files-found: error
      - name: Generate App Icons
        run: node scripts/generate_icons.js
      - name: Build Tauri Desktop App
        run: npx tauri build
      - name: Upload Linux Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-linux-desktop
          path: src-tauri/target/release/bundle/

  # 4. Build IntelliJ Platform Plugin & Run Kotlin/JUnit Tests
  build-intellij-plugin:
    name: Build IntelliJ Platform Plugin & Test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: intellij-plugin
      - run: npm ci
      - name: Bundle Web SPA into IntelliJ Webview
        run: node scripts/build_intellij_plugin.js
      - name: Run IntelliJ Plugin Tests & Build Plugin
        run: |
          cd intellij-plugin
          chmod +x gradlew || true
          ./gradlew test buildPlugin
      - name: Upload Allure test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-intellij
          path: intellij-plugin/build/allure-results
          if-no-files-found: error
      - name: Upload IntelliJ Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-intellij-plugin
          path: intellij-plugin/build/distributions/

  # 5. Publish Web Test Results Report
  publish-web:
    name: Publish Web Test Results
    needs: build-web
    if: needs.build-web.result == 'success'
    permissions:
      actions: read
      contents: write
    uses: sangharshgautam/allure3/.github/workflows/publish-report.yml@main
    with:
      project: jsonspy-web
      hub-repo: sangharshgautam/allure3
      artifact-name: jsonspy-web
    secrets:
      HUB_TOKEN: ${{ secrets.HUB_TOKEN }}

  # 6. Publish Windows Test Results Report
  publish-windows:
    name: Publish Windows Test Results
    needs: build-windows
    if: needs.build-windows.result == 'success'
    permissions:
      actions: read
      contents: write
    uses: sangharshgautam/allure3/.github/workflows/publish-report.yml@main
    with:
      project: jsonspy-windows
      hub-repo: sangharshgautam/allure3
      artifact-name: jsonspy-windows
    secrets:
      HUB_TOKEN: ${{ secrets.HUB_TOKEN }}

  # 7. Publish Linux Test Results Report
  publish-linux:
    name: Publish Linux Test Results
    needs: build-linux
    if: needs.build-linux.result == 'success'
    permissions:
      actions: read
      contents: write
    uses: sangharshgautam/allure3/.github/workflows/publish-report.yml@main
    with:
      project: jsonspy-linux
      hub-repo: sangharshgautam/allure3
      artifact-name: jsonspy-linux
    secrets:
      HUB_TOKEN: ${{ secrets.HUB_TOKEN }}

  # 8. Publish IntelliJ Plugin Test Results Report
  publish-intellij:
    name: Publish IntelliJ Test Results
    needs: build-intellij-plugin
    if: needs.build-intellij-plugin.result == 'success'
    permissions:
      actions: read
      contents: write
    uses: sangharshgautam/allure3/.github/workflows/publish-report.yml@main
    with:
      project: jsonspy-intellij
      hub-repo: sangharshgautam/allure3
      artifact-name: jsonspy-intellij
    secrets:
      HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
