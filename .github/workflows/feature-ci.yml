name: Feature Branch CI (Web SPA Build & Test)

on:
  push:
    branches: [ 'feature/*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test-web:
    name: Build & Test Web SPA
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright:v1.50.0-jammy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: Run Vitest Unit Tests
        run: |
          mkdir -p test-results
          npm test

      - name: Run Playwright E2E Tests
        run: npx playwright test

      - name: Merge Test Reports for Allure
        run: node scripts/merge_junit_reports.js

      - name: Upload Web Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-web
          path: test-results/
          if-no-files-found: error

      - name: Run Web SPA Production Build
        run: npm run build

  publish-web:
    name: Publish Web Test Results
    needs: build-and-test-web
    if: needs.build-and-test-web.result == 'success'
    permissions:
      actions: read
      contents: write
    uses: sangharshgautam/allure3/.github/workflows/publish-report.yml@main
    with:
      project: jsonspy-web
      hub-repo: sangharshgautam/allure3
      artifact-name: jsonspy-web
    secrets:
      HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
