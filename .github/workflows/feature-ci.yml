name: Feature Branch CI (Web SPA Build & Test)

on:
  push:
    branches: [ 'feature/*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test-web:
    name: Build & Test Web SPA
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run Playwright E2E Tests
        run: npm run test:e2e

      - name: Upload Web Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jsonspy-web
          path: test-results/
  #          if-no-files-found: warn

#      - name: Run Web SPA Production Build
#        run: npm run build

  publish-web:
    name: Publish Web Test Results
    needs: build-and-test-web
    if: always()
    permissions:
      actions: read
      contents: write
    uses: sangharshgautam/allure3/.github/workflows/publish-report.yml@main
    with:
      project: jsonspy-web
      hub-repo: sangharshgautam/allure3
      artifact-name: jsonspy-web
    secrets:
      HUB_TOKEN: ${{ secrets.HUB_TOKEN }}