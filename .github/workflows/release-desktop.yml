name: Release Desktop Apps (Windows, Linux, macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-desktop:
    name: Build & Release Tauri Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            artifact_glob: 'src-tauri/target/release/bundle/msi/*.msi'
          - platform: 'ubuntu-26.04'
            artifact_glob: 'src-tauri/target/release/bundle/deb/*.deb'
          - platform: 'macos-latest'
            artifact_glob: 'src-tauri/target/release/bundle/dmg/*.dmg'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install GTK & WebKit Dependencies (Linux only)
        if: matrix.platform == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - name: Generate AppIcons
        run: node scripts/generate_icons.js

      - name: Build Tauri Desktop App
        run: npm run tauri build

      - name: Upload MSI to Azure Storage ($web container)
        if: matrix.platform == 'windows-latest' && secrets.AZURE_STORAGE_CONNECTION_STRING != ''
        uses: azure/CLI@v2
        with:
          inlineScript: |
            $msiFile = Get-Item src-tauri/target/release/bundle/msi/*.msi
            az storage blob upload `
              --container-name '$web' `
              --file $msiFile.FullName `
              --name $msiFile.Name `
              --connection-string '${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}' `
              --overwrite true

      - name: Upload Desktop Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_glob }}
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          name: 'JSONSpy Workbench ${{ github.ref_name }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
