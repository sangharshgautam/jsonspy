name: Release Desktop Apps (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-desktop:
    name: Build & Release Tauri Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - run: npm ci

      - name: Generate AppIcons
        run: node scripts/generate_icons.js

      - name: Build Tauri Desktop App
        run: npm run tauri build

      - name: Upload MSI to Azure Storage ($web container)
        if: runner.os == 'Windows'
        uses: azure/CLI@v2
        with:
          inlineScript: |
            $msiFile = Get-Item src-tauri/target/release/bundle/msi/*.msi
            az storage blob upload `
              --container-name '$web' `
              --file $msiFile.FullName `
              --name $msiFile.Name `
              --connection-string '${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}' `
              --overwrite true

      - name: Upload Desktop Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: 'src-tauri/target/release/bundle/msi/*.msi'
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          name: 'JSONSpy Workbench ${{ github.ref_name }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
