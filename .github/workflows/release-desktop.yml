name: Release Desktop Apps (Windows, Linux, macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-desktop:
    name: Build & Release Tauri Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'ubuntu-26.04'
          - platform: 'macos-latest'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install GTK & WebKit Dependencies (Linux only)
        if: matrix.platform == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - name: Generate AppIcons
        run: node scripts/generate_icons.js

      - name: Build & Publish Tauri Release
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'JSONSpy Workbench ${{ github.ref_name }}'
          releaseBodyPath: 'CHANGELOG.md'
          releaseDraft: false
          prerelease: false

      - name: Copy MSI to Public Folders for Cloudflare Pages
        if: matrix.platform == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path public, landing/public
          Copy-Item src-tauri\target\release\bundle\msi\*.msi public\ -Force
          Copy-Item src-tauri\target\release\bundle\msi\*.msi landing\public\ -Force
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add public/*.msi landing/public/*.msi
          git commit -m "chore: auto-attach versioned MSI installer for Cloudflare Pages [skip ci]" || true
          git push origin HEAD:${{ github.ref_name }} || true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
