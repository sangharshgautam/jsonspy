name: Release Desktop Apps (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-desktop:
    name: Build & Release Tauri Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - run: npm ci

      - name: Generate AppIcons
        run: node scripts/generate_icons.js

      - name: Build Tauri Desktop App
        run: npm run tauri build

      - name: Copy MSI to Public Folders for Cloudflare Pages
        run: |
          New-Item -ItemType Directory -Force -Path public, landing/public
          Copy-Item src-tauri\target\release\bundle\msi\*.msi public\ -Force
          Copy-Item src-tauri\target\release\bundle\msi\*.msi landing\public\ -Force
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add public/*.msi landing/public/*.msi
          git commit -m "chore: auto-attach versioned MSI installer for Cloudflare Pages [skip ci]" || true
          git push origin HEAD:${{ github.ref_name }} || true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: 'src-tauri/target/release/bundle/msi/*.msi'
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          name: 'JSONSpy Workbench ${{ github.ref_name }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
