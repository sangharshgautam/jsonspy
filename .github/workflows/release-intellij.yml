name: Release IntelliJ Platform Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-intellij-plugin:
    name: Build & Release IntelliJ Plugin
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - run: npm ci

      - name: Bundle Web SPA into IntelliJ Webview
        run: node scripts/build_intellij_plugin.js

      - name: Build IntelliJ Plugin Distribution
        run: |
          cd intellij-plugin
          chmod +x gradlew || true
          ./gradlew buildPlugin

      - name: Attach Plugin Zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: intellij-plugin/build/distributions/*.zip
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Plugin to JetBrains Marketplace
        if: env.JETBRAINS_MARKETPLACE_TOKEN != ''
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          cd intellij-plugin
          ./gradlew publishPlugin -PpublishToken=$JETBRAINS_MARKETPLACE_TOKEN
