name: Build All Targets (Web, Windows, Linux, IntelliJ)

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 1. Build Web SPA Artifacts
  build-web:
    name: Build Web SPA Target
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Upload Web SPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-web-spa
          path: dist/

  # 2. Build Windows Desktop Executable
  build-windows:
    name: Build Windows Desktop App (.msi / .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Generate App Icons
        run: node scripts/generate_icons.js
      - name: Build Tauri Desktop App
        run: npm run tauri build
      - name: Upload Windows Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-windows-desktop
          path: src-tauri/target/release/bundle/

  # 3. Build Ubuntu / Linux Desktop App (.deb / .AppImage)
  build-linux:
    name: Build Ubuntu / Linux App (.deb / .AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install GTK & WebKit Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Generate App Icons
        run: node scripts/generate_icons.js
      - name: Build Tauri Desktop App
        run: npm run tauri build
      - name: Upload Linux Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-linux-desktop
          path: src-tauri/target/release/bundle/

  # 4. Build IntelliJ Platform Plugin
  build-intellij-plugin:
    name: Build IntelliJ Platform Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - run: npm ci
      - name: Bundle Web SPA into IntelliJ Webview
        run: node scripts/build_intellij_plugin.js
      - name: Build IntelliJ Plugin with Gradle Wrapper
        run: |
          cd intellij-plugin
          chmod +x gradlew || true
          ./gradlew buildPlugin
      - name: Upload IntelliJ Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-intellij-plugin
          path: intellij-plugin/build/distributions/
