name: Build All Targets & Run Tests (Web, Windows, Linux, macOS, IntelliJ)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 1. Build Web SPA Artifacts & Run Unit Tests
  build-web:
    name: Build & Test Web SPA Target
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Run Web SPA Unit Tests
        run: npm test
      - name: Upload Web Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-web
          path: test-results/
          if-no-files-found: warn
      - run: npm run build
      - name: Upload Web SPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-web-spa
          path: dist/

  # 2. Build Windows Desktop Executable & Run Rust Tests
  build-windows:
    name: Build Windows Desktop App (.msi / .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - run: npm ci
      - name: Run Rust Backend Tests & Export Results
        run: |
          New-Item -ItemType Directory -Force -Path test-results
          cargo test --manifest-path src-tauri/Cargo.toml -- --format json > test-results/rust-test-output.json
        continue-on-error: true
      - name: Upload Windows Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-windows
          path: test-results/
          if-no-files-found: warn
      - name: Generate App Icons
        run: node scripts/generate_icons.js
      - name: Build Tauri Desktop App
        run: npx @tauri-apps/cli build
      - name: Upload Windows Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-windows-desktop
          path: src-tauri/target/release/bundle/

  # 3. Build Ubuntu / Linux Desktop App & Run Rust Tests
  build-linux:
    name: Build Ubuntu / Linux App (.deb / .AppImage)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install GTK & WebKit Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Run Rust Backend Tests & Export Results
        run: |
          mkdir -p test-results
          cargo test --manifest-path src-tauri/Cargo.toml -- --format json > test-results/rust-test-output.json || true
      - name: Upload Linux Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-linux
          path: test-results/
          if-no-files-found: warn
      - name: Generate App Icons
        run: node scripts/generate_icons.js
      - name: Build Tauri Desktop App
        run: npx @tauri-apps/cli build
      - name: Upload Linux Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-linux-desktop
          path: src-tauri/target/release/bundle/

  # 4. Build macOS Desktop App & Run Rust Tests
  build-macos:
    name: Build macOS Desktop App (.dmg / .app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust Backend Tests & Export Results
        run: |
          mkdir -p test-results
          cargo test --manifest-path src-tauri/Cargo.toml -- --format json > test-results/rust-test-output.json || true
      - name: Upload macOS Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-macos
          path: test-results/
          if-no-files-found: warn
      - name: Generate App Icons
        run: node scripts/generate_icons.js
      - name: Build Tauri Desktop App
        run: npx @tauri-apps/cli build
      - name: Upload macOS Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-macos-desktop
          path: src-tauri/target/release/bundle/

  # 5. Build IntelliJ Platform Plugin & Run Kotlin/JUnit Tests
  build-intellij-plugin:
    name: Build IntelliJ Platform Plugin & Test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: intellij-plugin
      - run: npm ci
      - name: Bundle Web SPA into IntelliJ Webview
        run: node scripts/build_intellij_plugin.js
      - name: Run IntelliJ Plugin Tests & Build Plugin
        run: |
          cd intellij-plugin
          chmod +x gradlew || true
          ./gradlew test buildPlugin
      - name: Upload Allure test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-intellij
          path: intellij-plugin/build/allure-results
          if-no-files-found: warn
      - name: Upload IntelliJ Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-intellij-plugin
          path: intellij-plugin/build/distributions/

  # 6. Publish Web Test Results Report
  publish-web:
    name: Publish Web Test Results
    needs: build-web
    if: always()
    permissions:
      actions: read
      contents: write
    uses: sangharshgautam/allure3/.github/workflows/publish-report.yml@main
    with:
      project: jsonspy-web
      hub-repo: sangharshgautam/allure3
      artifact-name: jsonspy-web
    secrets:
      HUB_TOKEN: ${{ secrets.HUB_TOKEN }}

  # 7. Publish Windows Test Results Report
  publish-windows:
    name: Publish Windows Test Results
    needs: build-windows
    if: always()
    permissions:
      actions: read
      contents: write
    uses: sangharshgautam/allure3/.github/workflows/publish-report.yml@main
    with:
      project: jsonspy-windows
      hub-repo: sangharshgautam/allure3
      artifact-name: jsonspy-windows
    secrets:
      HUB_TOKEN: ${{ secrets.HUB_TOKEN }}

  # 8. Publish Linux Test Results Report
  publish-linux:
    name: Publish Linux Test Results
    needs: build-linux
    if: always()
    permissions:
      actions: read
      contents: write
    uses: sangharshgautam/allure3/.github/workflows/publish-report.yml@main
    with:
      project: jsonspy-linux
      hub-repo: sangharshgautam/allure3
      artifact-name: jsonspy-linux
    secrets:
      HUB_TOKEN: ${{ secrets.HUB_TOKEN }}

  # 9. Publish macOS Test Results Report
  publish-macos:
    name: Publish macOS Test Results
    needs: build-macos
    if: always()
    permissions:
      actions: read
      contents: write
    uses: sangharshgautam/allure3/.github/workflows/publish-report.yml@main
    with:
      project: jsonspy-macos
      hub-repo: sangharshgautam/allure3
      artifact-name: jsonspy-macos
    secrets:
      HUB_TOKEN: ${{ secrets.HUB_TOKEN }}

  # 10. Publish IntelliJ Plugin Test Results Report
  publish-intellij:
    name: Publish IntelliJ Test Results
    needs: build-intellij-plugin
    if: always()
    permissions:
      actions: read
      contents: write
    uses: sangharshgautam/allure3/.github/workflows/publish-report.yml@main
    with:
      project: jsonspy-intellij
      hub-repo: sangharshgautam/allure3
      artifact-name: jsonspy-intellij
    secrets:
      HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
