name: Manual Release Pipeline (Desktop Installers, IntelliJ Plugin & Landing Page)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (e.g., 1.0.3)'
        required: true
        default: '1.0.3'
        type: string

permissions:
  contents: write

jobs:
  # 0. Validate & Set Version Environment
  set-version:
    name: Set Version (${{ inputs.version }})
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ inputs.version }}
      tag: v${{ inputs.version }}
    steps:
      - run: echo "Releasing version ${{ inputs.version }}"

  # 1. Build Shared Web Frontend Bundle Once
  build-frontend:
    name: Build Shared Web Frontend Bundle
    needs: set-version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Upload Shared Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-dist
          path: dist/

  # 2. Build and Release Tauri Desktop Apps (Reusing Shared Frontend)
  release-desktop:
    name: Build & Release Tauri Desktop (${{ matrix.platform }})
    needs: [set-version, build-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            artifact_glob: 'src-tauri/target/release/bundle/msi/*.msi'
          - platform: 'ubuntu-26.04'
            artifact_glob: 'src-tauri/target/release/bundle/deb/*.deb'
          - platform: 'macos-latest'
            artifact_glob: 'src-tauri/target/release/bundle/dmg/*.dmg'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Download Shared Frontend Bundle
        uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: dist

      - name: Synchronize Tauri Version from Input
        shell: bash
        run: |
          CLEAN_VERSION="${{ needs.set-version.outputs.version }}"
          node -e '
            const fs = require("fs");
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            conf.version = process.argv[1];
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2));
          ' "$CLEAN_VERSION"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Cache APT packages (Linux only)
        if: matrix.platform == 'ubuntu-26.04'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-cache-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            apt-cache-${{ runner.os }}-

      - name: Install GTK & WebKit Dependencies (Linux only)
        if: matrix.platform == 'ubuntu-26.04'
        run: |
          dpkg -s libwebkit2gtk-4.1-dev >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev)

      - run: npm ci

      - name: Generate AppIcons
        run: node scripts/generate_icons.js

      - name: Build Tauri Desktop App
        run: npx tauri build

      - name: Upload Windows Bundle Artifact for Azure
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jsonspy-windows-bundle
          path: src-tauri/target/release/bundle/

      - name: Upload Desktop Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_glob }}
          tag_name: v${{ needs.set-version.outputs.version }}
          body_path: CHANGELOG.md
          name: 'JSONSpy Workbench v${{ needs.set-version.outputs.version }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. Upload Windows MSI to Azure Storage ($web container) on Linux Runner
  upload-azure-msi:
    name: Upload Windows MSI to Azure Storage
    needs: [set-version, release-desktop]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - name: Download Windows Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          name: jsonspy-windows-bundle
          path: windows-bundle
      - name: Upload MSI to Azure Storage ($web container)
        if: env.AZURE_STORAGE_CONNECTION_STRING != ''
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az storage blob upload-batch \
              --destination '$web' \
              --source windows-bundle/msi/ \
              --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
              --overwrite true

  # 4. Build and Attach IntelliJ Plugin Zip & Publish to JetBrains Marketplace
  release-intellij-plugin:
    name: Build & Release IntelliJ Plugin
    needs: [set-version, upload-azure-msi]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: intellij-plugin

      - run: npm ci

      - name: Bundle Web SPA into IntelliJ Webview
        run: node scripts/build_intellij_plugin.js

      - name: Build IntelliJ Platform Plugin Distribution
        run: |
          cd intellij-plugin
          chmod +x gradlew || true
          ./gradlew buildPlugin -Pversion=${{ needs.set-version.outputs.version }}

      - name: Attach Plugin Zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: intellij-plugin/build/distributions/*.zip
          tag_name: v${{ needs.set-version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Plugin to JetBrains Marketplace
        if: env.JETBRAINS_MARKETPLACE_TOKEN != ''
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          cd intellij-plugin
          ./gradlew publishPlugin -PpublishToken=$JETBRAINS_MARKETPLACE_TOKEN -Pversion=${{ needs.set-version.outputs.version }}

  # 5. Build & Deploy Landing Page Website
  release-landing:
    name: Build & Deploy Landing Page
    needs: [set-version, release-intellij-plugin]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: Build Landing Page
        run: node scripts/build_intellij_plugin.js || npm run build:landing

      - name: Deploy Landing Page to Azure Storage ($web container)
        if: env.AZURE_STORAGE_CONNECTION_STRING != ''
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az storage blob upload-batch \
              --destination '$web' \
              --source landing/dist/ \
              --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
              --overwrite true

  # 6. Automatically Create & Push Git Tag Upon Successful Release
  create-git-tag:
    name: Create & Push Git Tag
    needs: [set-version, release-landing]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git User
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
      - name: Create and Push Tag
        run: |
          TAG="${{ needs.set-version.outputs.tag }}"
          git tag -a "$TAG" -m "Automated Release $TAG via Manual Release Pipeline" || true
          git push origin "$TAG" || true

  # 7. Automatically Bump version.txt for Next Development Cycle
  bump-next-version:
    name: Bump version.txt for Next Development Cycle
    needs: create-git-tag
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git User
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
      - name: Increment Version in version.txt
        run: |
          CURRENT_VERSION="${{ needs.set-version.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "$NEXT_VERSION" > version.txt
          
          git add version.txt
          git commit -m "ci: bump version.txt to $NEXT_VERSION for next development cycle [skip ci]" || true
          git push origin main
