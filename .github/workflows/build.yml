name: Build All Targets & Run Tests (Web, Windows, IntelliJ)

on:
  push:
    branches: [ feature/* ]
  workflow_dispatch:

jobs:
  # 1. Build Web SPA Artifacts & Run Unit Tests
  build-web:
    name: Build & Test Web SPA Target
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Run Web SPA Unit Tests
        run: npm test
      - name: Upload Web Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jsonspy-web
          path: test-results/
          if-no-files-found: warn
      - run: npm run build