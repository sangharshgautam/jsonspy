name: Deploy Web SPA Manually

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., 1.0.3)'
        required: true
        default: '1.0.3'
        type: string

permissions:
  contents: write

jobs:
  deploy-web:
    name: Build & Deploy Web SPA
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Deploy Web SPA to Azure Storage ($web container)
        if: env.AZURE_STORAGE_CONNECTION_STRING != ''
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az storage blob upload-batch \
              --destination '$web' \
              --source dist/ \
              --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
              --overwrite true
      - name: Deploy Web SPA to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: andykenward/github-actions-cloudflare-pages@v3.6.1
        with:
          cloudflare-api-token: ${{ env.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-project-name: 'jsonspy-25s'
          directory: 'dist'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-environment: ${{ (github.ref == 'refs/heads/main' && 'production') || 'preview' }}
